<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Offline - Hangarin</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 4rem 1rem; background: #f8f9fa; }
        h1 { margin-bottom: .5rem; }
        button { padding: .5rem 1.25rem; border: 0; border-radius: .375rem; background: #0d6efd; color: #fff; cursor: pointer; }

</head>
<body>
    <h1>You're offline</h1>

    <button onclick="location.reload()">Retry</button>

</html>
