{% extends 'base.html' %}
{% block title %}Confirm Sign In - Hangarin{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm text-center">
            <div class="card-body p-4">
                <h2 class="mb-3">Confirm Sign In</h2>
                <p class="mb-4">
                    You are about to sign in using your <strong>{{ account.get_provider.name }}</strong> account.
                </p>

                <form method="post">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-primary w-100 mb-2">Continue</button>
                </form>

                <a href="{% url 'account_login' %}" class="btn btn-outline-secondary w-100">Cancel</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
